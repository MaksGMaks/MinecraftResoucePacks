name: Build and Publish Resource Pack

on:
  push:
    branches: [master]

permissions:
  contents: write   # needed so GITHUB_TOKEN can create/update the release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install zip/unzip
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Run build and publish script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/build_and_publish.sh
          ./scripts/build_and_publish.sh
